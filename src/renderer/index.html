<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: file:;">
  <title>FlowMark Editor</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app-container">
    <!-- 左侧边栏 -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <!-- 标签页：文件 / 最近 -->
        <div class="sidebar-tabs">
          <button class="sidebar-tab active" data-tab="files">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2 2h4l1 1h5a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.1"/>
            </svg>
            文件
          </button>
          <button class="sidebar-tab" data-tab="recent">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
              <circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.1"/>
              <path d="M7 4v3.5l2.5 1.5" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
            </svg>
            最近
          </button>
        </div>
        <div class="sidebar-actions">
          <button class="btn-refresh" id="btn-refresh" title="刷新 (Cmd+R)">
            <svg class="refresh-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path d="M2.5 7a4.5 4.5 0 1 1 4.5 4.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M7 11.5V9.5L5 11.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <div class="add-dropdown" id="add-dropdown">
            <button class="icon-btn" id="btn-add" title="添加">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="dropdown-menu" id="dropdown-menu">
              <div class="dropdown-item" data-action="new-file">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M8 1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5L8 1z" stroke="currentColor" stroke-width="1.1"/>
                  <path d="M8 1v4h4" stroke="currentColor" stroke-width="1.1"/>
                </svg>
                <span>新建文件</span>
              </div>
              <div class="dropdown-item" data-action="new-folder">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M1 3a1 1 0 0 1 1-1h3.586a1 1 0 0 1 .707.293L7.414 3.4A1 1 0 0 0 7.707 4H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3z" stroke="currentColor" stroke-width="1.1"/>
                </svg>
                <span>新建文件夹</span>
              </div>
              <div class="dropdown-separator"></div>
              <div class="dropdown-item" data-action="change-workspace">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <path d="M1 3.5A1.5 1.5 0 0 1 2.5 2h3.172a1.5 1.5 0 0 1 1.06.44l.658.658H13.5A1.5 1.5 0 0 1 15 4.5v8a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 1 12.5v-9z" stroke="currentColor" stroke-width="1.1"/>
                </svg>
                <span>切换工作区</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="workspace-name" id="workspace-name">未选择工作区</div>
      <!-- 文件列表 -->
      <div class="file-tree" id="file-tree">
        <div class="empty-state" id="empty-state">
          <p>点击 + 按钮选择工作区</p>
        </div>
      </div>
      <!-- 最近文件列表 -->
      <div class="recent-list" id="recent-list" style="display: none;">
        <div class="recent-empty" id="recent-empty">
          <p>暂无最近文件</p>
        </div>
      </div>
    </aside>

    <!-- 主编辑区 -->
    <main class="editor-container">
      <!-- MarkReader 风格工具栏 -->
      <div class="toolbar" id="toolbar">
        <div class="toolbar-left">
          <span class="file-name" id="current-file-name">未打开文件</span>
          <span class="reading-progress" id="reading-progress"></span>
        </div>
        <div class="toolbar-center">
          <button class="toolbar-btn" id="btn-zoom-decrease" title="缩小">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M5 7h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="zoom-level" id="zoom-level">100%</span>
          <button class="toolbar-btn" id="btn-zoom-increase" title="放大">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M11 11l3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              <path d="M5 7h4M7 5v4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <span class="toolbar-sep">|</span>
          <button class="toolbar-btn" id="btn-reading-mode" title="阅读模式">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 3h12v10H2z" stroke="currentColor" stroke-width="1.2"/>
              <path d="M4 5h8M4 8h8M4 11h6" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="toolbar-btn" id="btn-outline" title="大纲">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="toolbar-right">
          <button class="toolbar-btn" id="btn-search" title="搜索 (Cmd+F)">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <circle cx="6.5" cy="6.5" r="4.5" stroke="currentColor" stroke-width="1.2"/>
              <path d="M10 10l3.5 3.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="toolbar-btn" id="btn-fullscreen" title="全屏">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 5V2h3M11 2h3v3M14 11v3h-3M5 14H2v-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="view-switch" id="view-switch">
            <button class="view-btn active" data-view="edit" title="编辑">编辑</button>
            <button class="view-btn" data-view="preview" title="预览">预览</button>
            <button class="view-btn" data-view="both" title="双栏">双栏</button>
          </div>
          <div class="font-size-control">
            <button class="toolbar-btn" id="btn-font-decrease" title="减小字体">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M3 7h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
            <span class="font-size-display" id="font-size-display">16</span>
            <button class="toolbar-btn" id="btn-font-increase" title="增大字体">
              <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                <path d="M7 3v8M3 7h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              </svg>
            </button>
          </div>
          <div class="theme-select" id="theme-select">
            <button class="toolbar-btn" id="btn-theme" title="主题">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.2"/>
                <path d="M8 2v2M8 12v2M2 8h2M12 8h2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>
            <div class="theme-dropdown" id="theme-dropdown">
              <div class="theme-option" data-theme="light">
                <span class="theme-color" style="background: #fff; border: 1px solid #ddd;"></span>
                浅色
              </div>
              <div class="theme-option" data-theme="dark">
                <span class="theme-color" style="background: #1e1e1e;"></span>
                深色
              </div>
              <div class="theme-option" data-theme="sepia">
                <span class="theme-color" style="background: #F4ECD8;"></span>
                护眼
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- 旧的工具栏保留用于编辑功能 -->
      <div class="insert-menu" id="insert-menu" style="display: none;">
        <button class="menu-btn" data-cmd="h1" title="一级标题">H1</button>
        <button class="menu-btn" data-cmd="h2" title="二级标题">H2</button>
        <button class="menu-btn" data-cmd="h3" title="三级标题">H3</button>
        <span class="menu-sep">|</span>
        <button class="menu-btn" data-cmd="bold" title="加粗 (Ctrl+B)"><strong>B</strong></button>
        <button class="menu-btn" data-cmd="italic" title="斜体 (Ctrl+I)"><em>I</em></button>
        <button class="menu-btn" data-cmd="underline" title="下划线"><u>U</u></button>
        <button class="menu-btn" data-cmd="strikethrough" title="删除线"><s>S</s></button>
        <span class="menu-sep">|</span>
        <button class="menu-btn" data-cmd="link" title="链接">🔗</button>
        <button class="menu-btn" data-cmd="image" title="图片">🖼</button>
        <button class="menu-btn" data-cmd="code" title="行内代码">&lt;/&gt;</button>
        <button class="menu-btn" data-cmd="codeblock" title="代码块">{ }</button>
        <span class="menu-sep">|</span>
        <button class="menu-btn" data-cmd="ul" title="无序列表">•</button>
        <button class="menu-btn" data-cmd="ol" title="有序列表">1.</button>
        <button class="menu-btn" data-cmd="todo" title="待办清单">☐</button>
        <button class="menu-btn" data-cmd="blockquote" title="引用">"</button>
        <button class="menu-btn" data-cmd="hr" title="分割线">—</button>
        <span class="menu-sep">|</span>
        <button class="menu-btn" data-cmd="table" title="表格">⊞</button>
      </div>
      <span class="save-status" id="save-status"></span>
      <div class="editor-split">
        <!-- 无文件选中时的欢迎界面 -->
        <div class="editor-welcome" id="editor-welcome">
          <div class="welcome-icon">
            <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
              <rect width="64" height="64" rx="12" fill="var(--accent-light)"/>
              <path d="M16 20h32M16 32h24M16 44h28" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
            </svg>
          </div>
          <h2 class="welcome-title">FlowMark Editor</h2>
          <p class="welcome-desc">从左侧选择一个 Markdown 文件开始编辑</p>
        </div>
        <!-- 编辑器区域 -->
        <div class="editor-content-wrapper" id="editor-wrapper" style="display: none;">
          <div class="editor-content" id="editor" contenteditable="true" spellcheck="false">
            <div class="editor-placeholder" id="editor-placeholder">开始输入，或按 / 唤起命令...</div>
          </div>
          <div class="preview-content" id="preview-content"></div>
        </div>
      </div>
      <div class="editor-footer">
        <span class="word-count" id="word-count">0 字</span>
        <span class="line-info" id="line-info">行 1</span>
      </div>
    </main>

    <!-- 右侧大纲栏 -->
    <aside class="outline-panel" id="outline-panel">
      <div class="outline-header">
        <span>目录</span>
      </div>
      <div class="outline-list" id="outline-list">
        <div class="outline-empty">暂无标题</div>
      </div>
    </aside>
  </div>

  <!-- 斜杠命令面板 -->
  <div class="slash-panel" id="slash-panel">
    <div class="slash-header">
      <span class="slash-title">插入模块</span>
    </div>
    <div class="slash-list" id="slash-list"></div>
  </div>

  <!-- 搜索面板 - 文档内搜索 -->
  <div class="search-panel" id="search-panel">
    <div class="search-header">
      <input type="text" class="search-input" id="search-input" placeholder="搜索文档内容...">
      <button class="search-close" id="search-close">×</button>
    </div>
    <div class="search-results" id="search-results"></div>
  </div>

  <!-- 格式化工具栏 -->
  <div class="format-toolbar" id="format-toolbar">
    <button class="toolbar-btn" data-format="bold" title="加粗 (Ctrl+B)">
      <strong>B</strong>
    </button>
    <button class="toolbar-btn" data-format="italic" title="斜体 (Ctrl+I)">
      <em>I</em>
    </button>
    <button class="toolbar-btn" data-format="underline" title="下划线 (Ctrl+U)">
      <u>U</u>
    </button>
    <button class="toolbar-btn" data-format="strikethrough" title="删除线">
      <s>S</s>
    </button>
    <div class="toolbar-separator"></div>
    <button class="toolbar-btn" data-format="link" title="链接 (Ctrl+K)">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M6 8l-2 2a2 2 0 0 1-2-2.8l2-2M8 6l2-2a2 2 0 0 1 2.8 2.8l-2 2" stroke="currentColor" stroke-width="1.3"/>
      </svg>
    </button>
    <button class="toolbar-btn" data-format="code" title="行内代码">
      <code>&lt;/&gt;</code>
    </button>
  </div>

  <!-- 右键菜单 -->
  <div class="context-menu" id="context-menu">
    <div class="context-menu-item" data-action="new-file">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M8 1H3a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V5L8 1z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M8 1v4h4" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>新建文件</span>
    </div>
    <div class="context-menu-item" data-action="new-folder">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 3a1 1 0 0 1 1-1h3.586a1 1 0 0 1 .707.293L7.414 3.4A1 1 0 0 0 7.707 4H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3z" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>新建文件夹</span>
    </div>
    <div class="context-menu-separator"></div>
    <div class="context-menu-item" data-action="show-in-folder">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M1 3a1 1 0 0 1 1-1h3.586a1 1 0 0 1 .707.293L7.414 3.4A1 1 0 0 0 7.707 4H12a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V3z" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>在文件夹中显示</span>
    </div>
    <div class="context-menu-item" data-action="rename">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M10.5 1.5l2 2-8 8H2.5v-2l8-8z" stroke="currentColor" stroke-width="1.1"/>
        <path d="M9 2.5l2 2" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>重命名</span>
    </div>
    <div class="context-menu-item danger" data-action="delete">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 3.5h10M5 3.5V2.5a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v1M11 3.5l-.7 7.8a1 1 0 0 1-1 .7H4.7a1 1 0 0 1-1-.7L3 3.5" stroke="currentColor" stroke-width="1.1"/>
      </svg>
      <span>删除</span>
    </div>
  </div>

  <!-- 输入对话框 -->
  <div class="dialog-overlay" id="dialog-overlay">
    <div class="dialog">
      <div class="dialog-title" id="dialog-title">输入</div>
      <input type="text" class="dialog-input" id="dialog-input">
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" id="dialog-cancel">取消</button>
        <button class="dialog-btn confirm" id="dialog-confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 确认对话框 -->
  <div class="confirm-overlay" id="confirm-overlay">
    <div class="confirm-dialog">
      <div class="confirm-title" id="confirm-title">确认删除</div>
      <div class="confirm-message" id="confirm-message">确定要删除吗？</div>
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" id="confirm-cancel">取消</button>
        <button class="dialog-btn confirm danger" id="confirm-ok">删除</button>
      </div>
    </div>
  </div>

  <!-- 冲突解决对话框 -->
  <div class="conflict-overlay" id="conflict-overlay">
    <div class="conflict-dialog">
      <div class="conflict-title">文件冲突</div>
      <div class="conflict-message" id="conflict-message">文件已被外部修改</div>
      <div class="conflict-buttons">
        <button class="dialog-btn" id="conflict-overwrite">覆盖本地</button>
        <button class="dialog-btn" id="conflict-keep">保留本地</button>
        <button class="dialog-btn cancel" id="conflict-reload">重新加载</button>
      </div>
    </div>
  </div>

  <!-- 表格编辑器对话框 -->
  <div class="table-dialog-overlay" id="table-dialog-overlay">
    <div class="table-dialog">
      <div class="table-title">插入表格</div>
      <div class="table-inputs">
        <div class="table-input-row">
          <label>行数</label>
          <input type="number" id="table-rows" value="3" min="2" max="20">
        </div>
        <div class="table-input-row">
          <label>列数</label>
          <input type="number" id="table-cols" value="3" min="2" max="10">
        </div>
      </div>
      <div class="dialog-buttons">
        <button class="dialog-btn cancel" id="table-cancel">取消</button>
        <button class="dialog-btn confirm" id="table-insert">插入</button>
      </div>
    </div>
  </div>

  <!-- 图片插入进度 -->
  <div class="image-progress" id="image-progress">
    <div class="image-progress-text">正在插入图片...</div>
  </div>

  <!-- 项目搜索面板 -->
  <div class="search-panel project-search" id="search-panel-project">
    <div class="search-panel-header">
      <div class="search-panel-input-wrapper">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 14 14" fill="none">
          <circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.1"/>
          <path d="M9.5 9.5l3 3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/>
        </svg>
        <input type="text" class="search-input" id="search-input-project" placeholder="在文件中搜索...">
        <button class="search-clear" id="search-clear" style="display: none;">×</button>
      </div>
      <button class="search-close" id="search-close-project">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
          <path d="M3 3l8 8M11 3l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="search-panel-info" id="search-info-project"></div>
    <div class="search-panel-results" id="search-results-project"></div>
  </div>

  <!-- 关于对话框 - macOS 风格 -->
  <div class="about-overlay" id="about-overlay">
    <div class="about-dialog">
      <button class="about-close" id="about-close">×</button>
      <div class="about-content">
        <div class="about-logo">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <rect width="48" height="48" rx="10" fill="#3B82F6"/>
            <path d="M12 16h24M12 24h18M12 32h21" stroke="white" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </div>
        <h2 class="about-title">FlowMark Editor</h2>
        <p class="about-version">版本 1.0.0</p>
        <p class="about-desc">一款轻量级本地 Markdown 编辑器</p>
        <p class="about-copyright">© 2024 FlowMark</p>
      </div>
    </div>
  </div>

  <script src="scripts/app.js"></script>
</body>
</html>
